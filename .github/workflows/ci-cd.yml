name: Raahi CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build Validation & Tests
  validate-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            Backend/package-lock.json

      # 1. Validate Backend
      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      # 2. Validate Frontend Build
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        env:
          VITE_BASE_URL: http://localhost:4000
        run: npm run build

  # Job 2: Build & Push Docker Images to Docker Hub
  build-and-push-docker:
    name: Build & Push Docker Images
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/raahi-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/raahi-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_BASE_URL=http://localhost:4000
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/raahi-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/raahi-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
