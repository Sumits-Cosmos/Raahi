services:
  # In-Memory Geospatial & Pub/Sub Store
  redis:
    image: redis:7-alpine
    container_name: raahi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Primary Database
  mongodb:
    image: mongo:7.0
    container_name: raahi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend REST & Socket.IO API Server (Port 4000)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: raahi-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_CONNECT=${DB_CONNECT:-mongodb://mongodb:27017/raahi}
      - JWT_SECRET=${JWT_SECRET:-raahi_secret}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOCATIONIQ_API=${LOCATIONIQ_API}
      - AUTOCOMPLETESUGGETION_API=${AUTOCOMPLETESUGGETION_API}
      - GOOGLE_MAPS_API=${GOOGLE_MAPS_API}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  # Frontend NGINX Web Server (Port 5173 -> Container Port 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BASE_URL=http://localhost:4000
    container_name: raahi-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis-data:
  mongo-data:
